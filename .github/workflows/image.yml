# Build the NAS image (amd64 + arm64) on every change to the app and publish it to GitHub's
# container registry, so the NAS only pulls a ready image and never builds anything.
name: NAS image
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "data/**", "requirements.txt", "Dockerfile.nas"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nas
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ajinkyaa2004/pucktrace:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
