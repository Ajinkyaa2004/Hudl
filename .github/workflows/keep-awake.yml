# Render Free puts the server to sleep after 15 minutes without a request; waking takes about a
# minute and a fresh start forgets the game list and what the tool learned. A request every
# 10 minutes keeps it awake (one always-on service fits in Render's 750 free hours a month).
name: Keep the server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 90 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://pucktrace-api-8u5i.onrender.com/api/healthz
